data:
  pyterrier_dataset: "irds:msmarco-passage/trec-dl-2019/judged"
  text_fields: ["text"]
  max_docs: 20000
  max_queries: 200
  topic_column: "query"
  docno_column: "docno"
  training_dataset_name: "Tevatron/msmarco-passage"
  training_split: "train"
  training_format: "hf_tevatron_passage"
  query_column: "query"
  positive_column: "positive_passages"
  negative_column: "negative_passages"
  tevatron_positive_passages_column: "positive_passages"
  tevatron_negative_passages_column: "negative_passages"
  tevatron_passage_text_field: "text"
  candidate_source: "pyterrier_bm25"
  candidates_per_query: 200
  local_terrier_index_path: "./indices/msmarco-passage"
  build_local_terrier_index_if_missing: true
  terrier_index_threads: 4
  terrier_index_overwrite: false
  terrier_meta_lengths:
    docno: 64
    text: 4096
  full_embeddings_source: "auto"
  hf_embeddings_repo_id: "FrAle01/msmarco-passage-full-embeddings"
  hf_embeddings_split: "train"
  hf_embeddings_docno_column: "docno"
  hf_embeddings_vector_column: "full_embedding"

model:
  mode: "finetune"
  backend: "sentence_transformers"
  model_name_or_path: "nomic-ai/modernbert-embed-base"
  trust_remote_code: true
  query_prompt: "search_query: "
  document_prompt: "search_document: "
  similarity: "dot"
  full_profile_name: "full"

profiles:
  - {name: "d32", dimension: 32, normalize: true}
  - {name: "d64", dimension: 64, normalize: true}
  - {name: "d128", dimension: 128, normalize: true}
  - {name: "d256", dimension: 256, normalize: true}
  - {name: "d512", dimension: 512, normalize: true}
  - {name: "full", dimension: 768, normalize: true}

utility:
  metric: "hybrid_score_margin_utility"
  epsilon: 1.0e-6
  alpha: 0.7
  sample_pairs_per_query: 64
  relevance:
    mode: "weak"
    weak_source: "bm25"

optimization:
  budget_gb: 0.20
  algorithm: "lagrangian_dual"
  max_iter: 64
  tolerance: 1.0e-3
  mode: "batch"

retrieval:
  mode: "dense_exact"
  top_k: 100
  candidate_k: 2000
  terrier_wmodel: "BM25"

execution:
  output_dir: "outputs"
  experiment_name: "finetune_nomic_msmarco_batch"
  device: "cuda"
  dtype: "float16"
  doc_batch_size: 128
  query_batch_size: 64
  save_score_pairs: true
  save_runs: true
  verbose: true

training:
  enabled: true
  output_model_dir: "outputs/models/nomic_mrl_msmarco"
  base_loss: "MultipleNegativesRankingLoss"
  use_matryoshka: true
  use_2d_matryoshka: false
  matryoshka_dimensions: [768, 512, 256, 128, 64, 32]
  epochs: 1
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-5
  warmup_ratio: 0.03
  weight_decay: 0.01
  fp16: false
  bf16: true
  save_steps: 25000
  eval_steps: 1000
  logging_steps: 50
  auto_resume_from_last_checkpoint: true
  hub:
    enabled: true
    repo_prefix: "FrAle01"
    private: true
    token_env: "HF_TOKEN"
    auto_repo_from_experiment: true
    repo_suffix_full: "finetuned-model"
    repo_suffix_lora: "lora-adapter"
